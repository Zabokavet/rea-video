[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "story-narrator"
version = "0.1.0"
description = "AI-voiced story narration with MP3/WAV export and an audio library."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Native Haitian Creole voice (Meta MMS-TTS) that runs on your own computer.
# For a smaller CPU-only torch: pip install torch --index-url https://download.pytorch.org/whl/cpu
kreyol = ["torch>=2.1", "transformers>=4.33", "numpy>=1.24"]
dev = ["pytest>=7"]

[project.scripts]
story-narrator = "story_narrator.__main__:main"

[tool.setuptools.packages.find]
include = ["story_narrator*"]

[tool.setuptools.package-data]
story_narrator = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
